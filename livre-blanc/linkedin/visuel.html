<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Arimo;font-weight:400;src:url(../fonts/arimo-latin-400-normal.woff2)}
@font-face{font-family:Arimo;font-weight:700;src:url(../fonts/arimo-latin-700-normal.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Arimo,sans-serif;background:#fff;color:#111;display:flex;flex-direction:column;overflow:hidden}
.img{height:700px;overflow:hidden}.img img{width:100%;height:100%;object-fit:cover;display:block}
.txt{flex:1;padding:56px 72px 60px;display:flex;flex-direction:column}
.k{font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#e64855;margin-bottom:18px}
h1{font-size:84px;line-height:1;letter-spacing:-.035em;font-weight:700}
.s{font-size:36px;font-weight:700;margin-top:16px}
.bar{width:70px;height:12px;border-radius:6px;background:#cbe170;margin-top:26px}
.bas{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #e6e2dd;padding-top:22px}
.logo{display:flex;align-items:baseline;gap:10px;font-weight:700;line-height:1}.logo .b{font-size:26px}.logo .w{font-size:44px;letter-spacing:-.035em}
.gsq{display:inline-grid;place-items:center;background:#e64855;color:#fff;border-radius:.12em;width:.82em;height:.9em;transform:rotate(-6deg);margin-right:.05em}
.pt{color:#e64855}.m{font-size:24px;color:#6b6564}
</style></head><body>
<div class="img"><img src="../img/couverture.jpg"></div>
<div class="txt"><p class="k">Livre blanc · 16 pages · gratuit</p><h1>Ce qui a changé en 2026</h1><p class="s">IA, marketing, communication, design</p><div class="bar"></div>
<div class="bas"><div class="logo"><span class="b">Béné</span><span class="w"><span class="gsq">G</span>ermaine<span class="pt">.</span></span></div><span class="m">Janvier à septembre 2026</span></div></div>
</body></html>
